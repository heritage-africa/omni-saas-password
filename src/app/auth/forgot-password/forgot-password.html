<div class="container mt-5" style="max-width: 500px;">
  <div class="card shadow">
    <div class="card-body p-4">
      <h3 class="card-title text-center mb-4">Récupération de compte</h3>

      <div *ngIf="message" class="alert alert-success">{{ message }}</div>
      <div *ngIf="error" class="alert alert-danger">{{ error }}</div>

      <form #form="ngForm" (ngSubmit)="onSubmit()" *ngIf="!message">
        <div class="mb-3">
          <label class="form-label">Email Professionnel</label>
          <input type="email"
                 class="form-control"
                 [(ngModel)]="email"
                 name="email"
                 required
                 placeholder="ex: bamba@omail.africa">
          <div class="form-text">Nous enverrons un lien de réinitialisation sur votre email de secours.</div>
        </div>

        <button type="submit" class="btn btn-primary w-100" [disabled]="isLoading || !email">
          <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2"></span>
          {{ isLoading ? 'Envoi en cours...' : 'Envoyer le lien' }}
        </button>
      </form>

      <div class="mt-3 text-center">
        <a href="https://accounts.omail.africa" class="text-decoration-none">Retour à la connexion</a>
      </div>
    </div>
  </div>
</div>
