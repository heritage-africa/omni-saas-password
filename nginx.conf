server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # --- Optimisation GZIP (Performance) ---
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # --- Headers de Sécurité de base ---
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Robots-Tag "noindex, nofollow";

    # --- API Proxy vers le backend Java ---
    # Proxy les appels API vers le serveur backend
    # IMPORTANT: À configurer avec l'URL réelle de votre backend
    location /api/ {
        # À adapter selon votre infrastructure OpenShift
        # Option 1: Si le backend est sur un service OpenShift nommé
        # proxy_pass http://omni365-password-api:8080;

        # Option 2: Externe (déploiement cloud)
        # proxy_pass https://your-backend-api.com;

        # Pour l'instant, commenté car backend non spécifié
        # (décommentez la ligne appropriée ci-dessus)
        # proxy_pass http://backend-url:port;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 90;
        proxy_connect_timeout 90;
        proxy_buffering off;
    }

    # --- Gestion du Cache pour les assets statiques ---
    # Angular génère des fichiers avec hash (ex: main.63647.js), on peut les cacher "à l'infini"
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Cache-Status "HIT";
        access_log off;
    }

    # --- Routing Angular (SPA) ---
    # IMPORTANT: Cette location doit être APRÈS les autres locations spécifiques
    location / {
        # Essaie d'abord de servir le fichier
        # Si ce n'est pas un fichier ou dossier, redirige vers index.html (client-side routing)
        try_files $uri $uri/ /index.html;

        # Cache Control pour index.html
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # --- Endpoint Healthcheck OpenShift ---
    location /health {
        access_log off;
        return 200 'healthy\n';
        add_header Content-Type text/plain;
    }

    location /healthz {
        access_log off;
        return 200 'OK\n';
        add_header Content-Type text/plain;
    }

    # --- Deny access to sensitive files ---
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}

